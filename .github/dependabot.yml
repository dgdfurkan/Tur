version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint:
        patterns:
          [
            'eslint',
            'eslint-*',
            '@eslint/*',
            'typescript-eslint',
            'prettier',
            'prettier-*',
            'globals',
          ]
      test:
        patterns: ['vitest', '@playwright/*', '@axe-core/*']
    ignore:
      # @astrojs/check and typescript-eslint do not support TypeScript 6.1+ yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
